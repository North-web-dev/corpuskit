name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  binaries:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux,  goarch: amd64 }
          - { goos: linux,  goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
      - name: build
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          TAG: ${{ github.ref_name }}
        run: |
          out="corpuskit-${TAG}-${GOOS}-${GOARCH}"
          go build -trimpath -ldflags="-s -w" -o "corpuskit" ./cmd/corpuskit
          tar -czf "${out}.tar.gz" corpuskit LICENSE README.md
          sha256sum "${out}.tar.gz" > "${out}.tar.gz.sha256"
      - name: upload
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" --title "$TAG" --generate-notes || true
          gh release upload "$TAG" corpuskit-*.tar.gz corpuskit-*.sha256 --clobber
